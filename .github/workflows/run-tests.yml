name: run tests
on: [push]
jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: 
          node-version: "26.x"
      - run: pnpm install
      - run: pnpm test
      - uses: hexlet-components/hello-from-hexlet-action@release
