name: run tests
on: [push]
jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: 
          node-version: "24.x"
      - run: npm install
      - run: npm test
      - uses: hexlet-components/hello-from-hexlet-action@release
